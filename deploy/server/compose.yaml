name: aireels-website

services:
  website:
    # Same Caddy 2.11.8 image already verified on the production gateway.
    image: caddy@sha256:f6228111e5fafa1a5238258d0858e103f10599b8d1659a146e7726681a002bb9
    container_name: aireels-website
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 64m
    cpus: 0.25
    pids_limit: 64
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./releases:/srv/releases:ro
    tmpfs:
      - /tmp:size=8m,mode=1777
      - /data:size=8m,mode=1777
    networks:
      - public-ingress
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "3"

networks:
  public-ingress:
    external: true
    name: narraside-production_edge
